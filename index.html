
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: transparent;
  font-family: Georgia, serif;
}

.clock {
  width: 100%;
  min-height: 110px;
  height: 110px;
  padding: 10px 22px;
  position: relative;
  overflow: hidden;
  border: 1px solid #756e53;
  border-radius: 13px;
  background: linear-gradient(110deg, #19231f, #292722);
  color: #eee6d2;
  box-shadow: inset 0 1px #ffffff15, 0 7px 24px #0003;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.sky {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  color: #f6e8b9;
  font-family: monospace;
  line-height: 1;
  text-shadow: 0 0 5px #fff3b0;
}

.content {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  flex: 1;
}

.moon-art,
.sun-art {
  width: 65px;
  height: 65px;
  flex-shrink: 0;
}

.time-wrap {
  text-align: center;
}

.time {
  font-family: Georgia, serif;
  font-size: clamp(28px, 5vw, 43px);
  letter-spacing: 5px;
  font-variant-numeric: tabular-nums;
  color: #eee6d2;
  text-shadow: 0 0 14px #e7d7a322;
}

.date {
  margin-top: 3px;
  color: #b8c5a2;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.bottom {
  position: relative;
  z-index: 2;
  min-height: 17px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  color: #9da995;
  font-family: Arial, sans-serif;
  font-size: 8px;
  letter-spacing: 1px;
  opacity: .68;
}

.country {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.converter {
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.converter input {
  width: 34px;
  padding: 1px 2px;
  border: 0;
  border-bottom: 1px solid #9da99555;
  outline: none;
  background: transparent;
  color: #b8c5a2;
  font: inherit;
  font-size: 8px;
  text-align: center;
}

.converter input:focus {
  border-bottom-color: #c5aa78;
}

@media(max-width:480px) {
  .clock { padding: 9px 10px; }
  .content { gap: 12px; }
  .moon-art, .sun-art { width: 48px; height: 48px; }
  .time { letter-spacing: 3px; }
  .date { font-size: 8px; }
  .bottom { font-size: 7px; gap: 5px; }
}
</style>
</head>

<body>
<div class="clock">

  <div class="sky" aria-hidden="true">
    <span class="star" style="top:12%;left:8%;font-size:9px">✦</span>
    <span class="star" style="top:24%;left:25%;font-size:6px">✧</span>
    <span class="star" style="top:13%;left:43%;font-size:7px">·</span>
    <span class="star" style="top:28%;left:61%;font-size:9px">✦</span>
    <span class="star" style="top:10%;left:78%;font-size:7px">✧</span>
    <span class="star" style="top:34%;left:92%;font-size:9px">✦</span>
    <span class="star" style="top:72%;left:5%;font-size:7px">✧</span>
    <span class="star" style="top:78%;left:30%;font-size:8px">·</span>
    <span class="star" style="top:70%;left:70%;font-size:7px">✧</span>
    <span class="star" style="top:83%;left:88%;font-size:8px">✦</span>
    <span class="star" style="top:48%;left:15%;font-size:6px">·</span>
    <span class="star" style="top:52%;left:85%;font-size:6px">·</span>
  </div>

  <div class="content">

    <!-- Static full pixel moon -->
    <svg class="moon-art" viewBox="0 0 64 64" shape-rendering="crispEdges">
      <circle cx="32" cy="32" r="23" fill="#f2df9e"/>
      <path fill="#d6bd7c" d="
        M15 20 H22 V25 H17 V31 H12 V25 H15 Z
        M38 12 H44 V17 H39 V21 H34 V16 H38 Z
        M42 35 H49 V41 H44 V46 H38 V40 H42 Z
        M24 43 H30 V48 H24 Z"/>
      <path fill="#fff4cf" d="
        M23 13 H31 V17 H23 Z
        M13 29 H17 V34 H13 Z
        M34 25 H39 V29 H34 Z"/>
      <path fill="#b49a62" d="
        M27 29 H32 V34 H27 Z
        M19 37 H24 V41 H19 Z"/>
    </svg>

    <div class="time-wrap">
      <div class="time" id="time">00:00:00</div>
      <div class="date" id="date">Loading date</div>
    </div>

    <!-- Slim static pixel sun -->
    <svg class="sun-art" viewBox="0 0 64 64" shape-rendering="crispEdges">
      <path fill="#d8a85c" d="
        M30 5 H34 V15 H30 Z
        M30 49 H34 V59 H30 Z
        M5 30 H15 V34 H5 Z
        M49 30 H59 V34 H49 Z
        M12 12 H17 V17 H12 Z
        M47 12 H52 V17 H47 Z
        M12 47 H17 V52 H12 Z
        M47 47 H52 V52 H47 Z"/>

      <path fill="#f2c879" d="
        M25 17 H39 V21 H43 V25 H47 V39 H43 V43
        H39 V47 H25 V43 H21 V39 H17 V25 H21 V21 H25 Z"/>

      <path fill="#ffe5a3" d="
        M25 17 H35 V21 H25 Z
        M17 25 H21 V35 H17 Z"/>

      <path fill="#d8a85c" d="
        M39 39 H43 V43 H39 Z
        M29 43 H39 V47 H29 Z"/>
    </svg>

  </div>

  <div class="bottom">
    <div class="country" id="country">Discovering somewhere...</div>
    <div class="converter">
      <span>₹</span>
      <input id="rupees" type="number" value="100" min="0" aria-label="Rupees">
      <span>⇄</span>
      <span id="dollars">$ --</span>
    </div>
  </div>

</div>

<script>
const zone = "Asia/Kolkata";

function updateClock() {
  const now = new Date();

  document.getElementById("time").textContent =
    new Intl.DateTimeFormat("en-GB", {
      timeZone: zone,
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hourCycle: "h23"
    }).format(now);

  document.getElementById("date").textContent =
    new Intl.DateTimeFormat("en-GB", {
      timeZone: zone,
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric"
    }).format(now);
}

updateClock();
setInterval(updateClock, 1000);

// Random country, capital and fun fact
const places = [
  ["Japan", "Tokyo", "Japan has more than 14,000 islands."],
  ["Iceland", "Reykjavik", "Iceland has no native mosquitoes."],
  ["Bhutan", "Thimphu", "Bhutan measures progress with Gross National Happiness."],
  ["Peru", "Lima", "Peru is home to the ancient city of Machu Picchu."],
  ["Finland", "Helsinki", "Finland has around 188,000 lakes."],
  ["Morocco", "Rabat", "Morocco is home to the world's oldest university."],
  ["New Zealand", "Wellington", "New Zealand has more sheep than people."],
  ["South Korea", "Seoul", "South Korea has a special word for the age of one year."],
  ["Egypt", "Cairo", "Ancient Egyptians used a 365-day calendar."],
  ["Norway", "Oslo", "Norway has a town where the sun doesn't rise for weeks in winter."],
  ["Canada", "Ottawa", "Canada has more lakes than any other country."],
  ["Greece", "Athens", "Greece has thousands of islands."],
  ["Australia", "Canberra", "Australia is wider than the Moon."],
  ["Italy", "Rome", "Italy has more UNESCO World Heritage sites than any other country."],
  ["Nepal", "Kathmandu", "Nepal is home to eight of the world's ten tallest mountains."]
];

let lastPlace = -1;

function changeCountry() {
  let next;
  do {
    next = Math.floor(Math.random() * places.length);
  } while (next === lastPlace);

  lastPlace = next;
  const [country, capital, fact] = places[next];

  document.getElementById("country").textContent =
    country + " · " + capital + " — " + fact;
}

changeCountry();
setInterval(changeCountry, 5 * 60 * 1000);

// INR to USD converter using a live exchange rate
let usdRate = null;

async function getRate() {
  try {
    const response = await fetch("https://open.er-api.com/v6/latest/INR");
    const data = await response.json();

    if (data.result === "success" && data.rates.USD) {
      usdRate = data.rates.USD;
      convertCurrency();
    }
  } catch (error) {
    document.getElementById("dollars").textContent = "$ --";
  }
}

function convertCurrency() {
  const rupees = Number(document.getElementById("rupees").value) || 0;

  document.getElementById("dollars").textContent =
    usdRate === null
      ? "$ --"
      : "$ " + (rupees * usdRate).toFixed(2);
}

document.getElementById("rupees").addEventListener("input", convertCurrency);

getRate();
setInterval(getRate, 60 * 60 * 1000);
</script>
</body>
</html>
