
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonlit Clock</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:transparent;color:#eee6d2;font-family:Georgia,serif}

.banner{
  width:100%;
  min-height:145px;
  position:relative;
  overflow:hidden;
  padding:12px 22px 7px;
  border:1px solid #756e53;
  border-radius:13px;
  background:linear-gradient(110deg,#19231f,#292722);
  box-shadow:inset 0 1px #ffffff15,0 7px 24px #0003;
}

.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;color:#f6e8b9;text-shadow:0 0 5px #fff3b0}

.layout{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:30% 12% 58%;
  align-items:center;
  min-height:112px;
}

/* CLOCK */
.clock-section{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  padding-left:5%;
}
.time{
  font-size:clamp(46px,4.6vw,63px);
  letter-spacing:5px;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  color:#eee6d2;
}
.date{
  margin-top:7px;
  font-size:13px;
  letter-spacing:1.8px;
  color:#b8c5a2;
  text-transform:uppercase;
  white-space:nowrap;
}

/* MOON AND SUN */
.celestial{
  display:flex;
  align-items:center;
  justify-content:center;
}
.celestial svg{
  width:100px;
  height:100px;
  overflow:visible;
  shape-rendering:crispEdges;
  filter:drop-shadow(0 0 12px #f2df9e40);
}
.moon-art,.sun-art{display:none}
.celestial.is-night .moon-art,
.celestial.is-day .sun-art{display:block}

/* VOCABULARY */
.vocab{
  border-left:1px solid #a89b7044;
  padding-left:22px;
  padding-right:12px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 180px;
  column-gap:22px;
  align-items:start;
  min-width:0;
}

.word{
  grid-column:1/-1;
  font-size:clamp(27px,2.5vw,35px);
  color:#f2dfb4;
  font-weight:bold;
  margin-bottom:5px;
  line-height:1.15;
}
.word-meta{
  grid-column:1/-1;
  font-family:Arial,sans-serif;
  font-size:12px;
  margin-bottom:7px;
  color:#b8c5a2;
}
.meaning{
  grid-column:1;
  font-size:17px;
  line-height:1.5;
  margin-bottom:7px;
}
#mnemonic,#example{
  grid-column:1;
  font-size:14px;
  line-height:1.5;
  margin-top:5px;
}
#hindi,#synonyms,#antonyms{
  grid-column:2;
  font-size:13px;
  line-height:1.5;
  margin-top:5px;
  color:#d8c99f;
  padding-left:15px;
  border-left:1px solid #a89b7044;
}
#hindi{grid-row:3}
#synonyms{grid-row:4}
#antonyms{grid-row:5}
.detail b{color:#d8c99f;font-weight:normal}

/* BOTTOM BAR */
.bottom{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-top:5px;
  padding-top:5px;
  border-top:1px solid #ffffff13;
  font-family:Arial,sans-serif;
  font-size:13px;
  min-height:22px;
}
.country{
  flex:1;
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:12px;
  color:#b8c5a2;
}

/* NAVIGATION */
.controls{
  display:flex;
  align-items:center;
  gap:7px;
  flex-shrink:0;
}
.controls button{
  width:25px;
  height:23px;
  border:1px solid #8c876c66;
  border-radius:5px;
  background:#ffffff09;
  color:#e8d7a9;
  cursor:pointer;
  font-size:15px;
}
.controls button:hover{background:#ffffff20}
.controls input{
  width:43px;
  height:23px;
  background:#ffffff09;
  color:#eee6d2;
  border:1px solid #8c876c66;
  border-radius:5px;
  text-align:center;
  font-family:Arial,sans-serif;
  font-size:10px;
  outline:none;
}
.controls span{
  font-family:Arial,sans-serif;
  font-size:10px;
  color:#9da995;
}

/* MOBILE */
@media(max-width:700px){
  .banner{padding:12px 13px 8px;min-height:unset}
  .layout{grid-template-columns:1fr;gap:13px;min-height:unset}
  .clock-section{align-items:center;padding:5px 0}
  .time{font-size:32px;letter-spacing:3px}
  .date{font-size:8px;letter-spacing:1px}
  .celestial{
    position:absolute;
    top:0;
    right:4px;
    opacity:.8;
    pointer-events:none;
  }
  .celestial svg{width:40px;height:40px}
  .vocab{
    grid-template-columns:1fr;
    border-left:none;
    border-top:1px solid #a89b7044;
    padding:12px 0 0;
  }
  .word,.word-meta,.meaning,#mnemonic,#example,
  #hindi,#synonyms,#antonyms{
    grid-column:1;
    grid-row:auto;
  }
  .word{font-size:21px}
  .meaning{font-size:12px}
  #mnemonic,#example,#hindi,#synonyms,#antonyms{
    font-size:10px;
    border-left:none;
    padding-left:0;
  }
  .bottom{flex-wrap:wrap;gap:8px;margin-top:5px;padding-top:5px}
  .country{flex-basis:100%;font-size:9px}
  .controls{justify-content:flex-end}
}
</style>
</head>

<script>
/* CLOCK */
const zone="Asia/Kolkata";

function updateClock(){
  const now=new Date();
  document.getElementById("time").textContent=
    new Intl.DateTimeFormat("en-GB",{
      timeZone:zone,hour:"2-digit",minute:"2-digit",
      second:"2-digit",hourCycle:"h23"
    }).format(now);

  document.getElementById("date").textContent=
    new Intl.DateTimeFormat("en-GB",{
      timeZone:zone,weekday:"long",day:"2-digit",
      month:"long",year:"numeric"
    }).format(now);
}
updateClock();
setInterval(updateClock,1000);

/* MOON AT NIGHT, SUN DURING DAY */
const celestial=document.getElementById("celestial");

function updateCelestial(){
  const hour=Number(new Intl.DateTimeFormat("en-GB",{
    timeZone:zone,hour:"2-digit",hourCycle:"h23"
  }).format(new Date()));

  if(hour>=17||hour<5){
    celestial.classList.add("is-night");
    celestial.classList.remove("is-day");
  }else{
    celestial.classList.add("is-day");
    celestial.classList.remove("is-night");
  }
}
updateCelestial();
setInterval(updateCelestial,60000);

/*

const words=[
["Epiphany","/ɪˈpɪfəni/ · noun","A sudden, profound realisation or moment of clarity.","Imagine a light suddenly switching on in your mind.","The passage led me to an epiphany about human ambition.","अचानक बोध · गहरी अनुभूति","Realisation, revelation, insight","Confusion, ignorance"],

["Empirical","/ɪmˈpɪrɪkəl/ · adjective","Based on observation, experience or evidence rather than theory alone.","Evidence you can observe or test.","The claim requires empirical evidence.","अनुभवजन्य · प्रमाण आधारित","Evidence-based, observational","Theoretical, speculative"],

/* VOCABULARY NAVIGATION */
let currentWord=0;

function showWord(index){
  if(index<0||index>=words.length)return;
  currentWord=index;
  const w=words[index];

  document.getElementById("word").textContent=(index+1)+" – "+w[0];
  document.getElementById("wordMeta").textContent=w[1];
  document.getElementById("meaning").textContent=w[2];

  const fields=[
    ["mnemonic","Memory: ",w[3]],
    ["example","Example: ",w[4]],
    ["hindi","",w[5]],
    ["synonyms","Similar: ",w[6]],
    ["antonyms","Opposite: ",w[7]]
  ];

  fields.forEach(([id,label,value])=>{
    const el=document.getElementById(id);
    el.replaceChildren();
    if(label){
      const b=document.createElement("b");
      b.textContent=label;
      el.append(b);
    }
    el.append(document.createTextNode(value||""));
  });

  document.getElementById("totalWords").textContent="/ "+words.length;
  document.getElementById("jump").value=index+1;
}

document.getElementById("previous").addEventListener("click",()=>{
  showWord((currentWord-1+words.length)%words.length);
});
document.getElementById("next").addEventListener("click",()=>{
  showWord((currentWord+1)%words.length);
});
document.getElementById("jump").addEventListener("change",e=>{
  const n=Number(e.target.value);
  if(Number.isInteger(n)&&n>=1&&n<=words.length)showWord(n-1);
  else e.target.value=currentWord+1;
});
showWord(0);

  ["Greece","Athens","Greece has thousands of islands."],
  ["Australia","Canberra","Australia is wider than the Moon."],
  ["Italy","Rome","Italy has more UNESCO World Heritage sites than any other country."],
  ["Nepal","Kathmandu","Nepal is home to eight of the world's ten tallest mountains."],
  ["Madagascar","Antananarivo","Most of Madagascar's wildlife is found nowhere else on Earth."],
  ["Chile","Santiago","Chile is home to the driest non-polar desert on Earth."],
  ["Turkey","Ankara","Istanbul spans two continents."],
  ["Switzerland","Bern","Switzerland has four national languages."],
  ["Mexico","Mexico City","Mexico City was built on an ancient lake."]
];

let lastPlace=-1;

function changeCountry(){
  let next;
  do{
    next=Math.floor(Math.random()*places.length);
  }while(next===lastPlace);

  lastPlace=next;
  const [country,capital,fact]=places[next];
  document.getElementById("country").textContent=
    country+" · "+capital+" — "+fact;
}
changeCountry();
setInterval(changeCountry,60000);
</script>
